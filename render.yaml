services:
  - type: web
    name: eyeconic-app-prod
    runtime: node
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://eyeconicmentors.vercel.app
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # ---- Public quiz guest flow (see docs/MSG91_SETUP.md) ----
      # Web origin for public quiz links (generated links point directly at
      # it; legacy backend share URLs 302 here). Falls back to the production
      # web origin if unset — links ALWAYS open the web quiz, never the app.
      - key: WEB_APP_URL
        value: https://eyeconicmentors.vercel.app
      # MSG91 SMS OTP (all three required for real SMS; without them phone
      # OTP returns 503 SMS_NOT_CONFIGURED). DLT registration is mandatory.
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: MSG91_SENDER_ID
        sync: false
      # HMAC secret for hashing guest OTPs at rest (falls back to JWT_SECRET).
      - key: OTP_HASH_SECRET
        sync: false
      # Guest session token lifetime (default 4h).
      - key: GUEST_JWT_EXPIRES_IN
        value: 4h
