# Render Blueprint — defines ONLY the Public Quiz web frontend (static site).
#
# The production backend `eyeconic-app-prod` is intentionally NOT declared in
# this file: it predates this blueprint and stays exactly as configured in
# the Render dashboard (plan, health check, and environment variables are
# all dashboard-managed). Render creates and manages only what this file
# declares, so applying this blueprint cannot touch the backend in any way.
# WEB_APP_URL is set manually on the backend once this site's URL is known —
# see docs/PUBLIC_WEB_DEPLOY.md.
services:
  - type: web
    name: eyeconic-public-web
    runtime: static
    region: singapore
    # No rootDir on purpose: with the build entered from the repo root,
    # staticPublishPath is unambiguous.
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: ./client/dist
    routes:
      # SPA fallback: /public-quiz/:token, /take, /result/:attemptId and
      # every client route resolve through index.html. Render serves real
      # files first (assets are untouched by rewrite rules).
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Vite 7 requires Node >= 22.12 — pin the build toolchain.
      - key: NODE_VERSION
        value: '22'
      # Build-time (public, non-secret) values baked into the bundle — same
      # values as client/.env.production. The backend URL appears here only
      # as the API the frontend CALLS, not as a managed service.
      - key: VITE_API_URL
        value: https://eyeconic-app-prod-1r8o.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://eyeconic-app-prod-1r8o.onrender.com
