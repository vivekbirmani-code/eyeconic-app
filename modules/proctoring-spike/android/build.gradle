// Phase 0 CV/ML feasibility spike — local Expo module (AI Proctoring plan §5).
// Wraps Google ML Kit Face Detection (bundled variant, no Play Services download
// needed at runtime). SPIKE ONLY — this module is not production proctoring code
// and must be removed or replaced when Phase 3 picks the production pipeline.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.eyeconic.proctoringspike'
version = '0.1.0'

android {
  namespace "eyeconic.proctoringspike"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Bundled ML Kit face detection (~model ships in the APK; the GMS "thin"
  // variant com.google.android.gms:play-services-mlkit-face-detection would
  // download the model via Play Services — a production decision, not a spike one).
  implementation 'com.google.mlkit:face-detection:16.1.7'

  // CameraX for the streaming analysis view (ProctoringCameraView). Pinned to
  // expo-camera's EXACT version (node_modules/expo-camera/android/build.gradle
  // camerax_version) — the runtime classes are already in the app graph, but
  // sibling modules cannot see another module's dependencies, so we declare
  // our own at the same version and compile against what the runtime resolves.
  // Caveat: the shared version rides expo-camera's pin across SDK upgrades.
  def camerax_version = "1.5.0-rc01"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
}
